name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the test image
        run: docker build --build-arg TESTER_UID="$(id -u)" -f Dockerfile.test -t hub-test .
      - name: Run the scenarios
        run: docker run --rm -v "$PWD:/src" -w /src hub-test python3 -m pytest -q
      - name: Run the shape scan
        run: docker run --rm -v "$PWD:/src" -w /src hub-test python3 -I tests/scrub_scan.py .

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install pytest
        run: python -m pip install pytest==9.2.0
      - name: Install tmux
        run: brew install tmux
      - name: Run the scenarios
        run: python -m pytest -q -p no:cacheprovider
